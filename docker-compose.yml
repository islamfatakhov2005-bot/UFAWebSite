services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ufa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ufa_website
      POSTGRES_USER: ufa
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ufa -d ufa_website"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ufa-website
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://ufa:${DB_PASSWORD_ENCODED:-${DB_PASSWORD}}@postgres:5432/ufa_website"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      CRM_API_URL: "${CRM_API_URL:-}"
      CRM_API_KEY: "${CRM_API_KEY:-}"
      NEXT_PUBLIC_SITE_NAME: "UFA - Uzbekistan Franchising Association"
      SQLITE_DIR: /app/data
    volumes:
      - leads_data:/app/data
    networks:
      - default
      - nginx_network
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  leads_data:

networks:
  nginx_network:
    external: true
    name: docker_internal
