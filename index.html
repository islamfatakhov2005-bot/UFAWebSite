<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Franchise Association — Сайт в разработке</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0a1f0a, #0f2b1a, #132e20, #0a2015);
            color: #fff;
            overflow: hidden;
        }

        .bg-circles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .bg-circles span {
            position: absolute;
            border-radius: 50%;
            background: rgba(74, 222, 128, 0.04);
            animation: float 20s infinite;
        }

        .bg-circles span:nth-child(1) { width: 400px; height: 400px; top: -100px; left: -100px; animation-delay: 0s; }
        .bg-circles span:nth-child(2) { width: 300px; height: 300px; bottom: -80px; right: -80px; animation-delay: -5s; }
        .bg-circles span:nth-child(3) { width: 200px; height: 200px; top: 50%; left: 60%; animation-delay: -10s; }
        .bg-circles span:nth-child(4) { width: 500px; height: 500px; bottom: 20%; left: -200px; animation-delay: -15s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.5; }
            50% { transform: translateY(-40px) scale(1.05); opacity: 1; }
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 2rem;
            max-width: 600px;
        }

        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 2rem;
        }

        .gear {
            width: 80px;
            height: 80px;
            animation: spin 10s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        h1 {
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            font-weight: 300;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #86efac, #ffffff, #6ee7b7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(to right, transparent, rgba(74, 222, 128, 0.5), transparent);
            margin: 1.5rem auto;
        }

        p {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.55);
            line-height: 1.7;
            font-weight: 300;
        }

        .domain {
            display: inline-block;
            margin-top: 2rem;
            padding: 0.6rem 1.5rem;
            border: 1px solid rgba(74, 222, 128, 0.2);
            border-radius: 50px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.45);
            letter-spacing: 0.1em;
            backdrop-filter: blur(10px);
            background: rgba(74, 222, 128, 0.04);
        }

        .pulse {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
            margin-right: 10px;
            animation: pulse 2s ease-in-out infinite;
            vertical-align: middle;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.4); }
            50% { opacity: 0.7; box-shadow: 0 0 0 10px rgba(74, 222, 128, 0); }
        }
    </style>
</head>
<body>
    <div class="bg-circles">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="container">
        <div class="icon">
            <svg class="gear" viewBox="0 0 100 100" fill="none">
                <defs>
                    <mask id="gearMask">
                        <rect width="100" height="100" fill="black"/>
                        <!-- Base circle -->
                        <circle cx="50" cy="50" r="34" fill="white"/>
                        <!-- 8 rectangular teeth evenly spaced -->
                        <rect x="44" y="2"  width="12" height="18" rx="3" fill="white"/>
                        <rect x="44" y="80" width="12" height="18" rx="3" fill="white"/>
                        <rect x="2"  y="44" width="18" height="12" rx="3" fill="white"/>
                        <rect x="80" y="44" width="18" height="12" rx="3" fill="white"/>
                        <!-- Diagonal teeth -->
                        <rect x="71" y="13" width="12" height="18" rx="3" fill="white" transform="rotate(45 77 22)"/>
                        <rect x="17" y="69" width="12" height="18" rx="3" fill="white" transform="rotate(45 23 78)"/>
                        <rect x="71" y="69" width="12" height="18" rx="3" fill="white" transform="rotate(-45 77 78)"/>
                        <rect x="17" y="13" width="12" height="18" rx="3" fill="white" transform="rotate(-45 23 22)"/>
                        <!-- Center hole -->
                        <circle cx="50" cy="50" r="14" fill="black"/>
                    </mask>
                </defs>
                <rect width="100" height="100" fill="rgba(74,222,128,0.1)" mask="url(#gearMask)"/>
                <circle cx="50" cy="50" r="34" fill="none" stroke="rgba(74,222,128,0.3)" stroke-width="0.5" mask="none"/>
                <!-- Visible inner circle -->
                <circle cx="50" cy="50" r="14" stroke="rgba(74,222,128,0.5)" stroke-width="1.2" fill="none"/>
                <circle cx="50" cy="50" r="5" fill="rgba(74,222,128,0.15)" stroke="rgba(74,222,128,0.4)" stroke-width="0.8"/>
            </svg>
        </div>

        <h1>Сайт в разработке</h1>

        <div class="divider"></div>

        <p>Мы работаем над созданием сайта.<br>Скоро здесь появится что-то интересное.</p>

        <div class="domain">
            <span class="pulse"></span>franchise-association.uz
        </div>
    </div>
</body>
</html>
