<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" width="1920" height="600">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3ECF8E"/>
      <stop offset="100%" style="stop-color:#4AADAD"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="600" fill="url(#bg2)"/>
  <!-- Subtle grid pattern -->
  <g stroke="white" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="600"/><line x1="80" y1="0" x2="80" y2="600"/>
    <line x1="160" y1="0" x2="160" y2="600"/><line x1="240" y1="0" x2="240" y2="600"/>
    <line x1="320" y1="0" x2="320" y2="600"/><line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="480" y1="0" x2="480" y2="600"/><line x1="560" y1="0" x2="560" y2="600"/>
    <line x1="640" y1="0" x2="640" y2="600"/><line x1="720" y1="0" x2="720" y2="600"/>
    <line x1="800" y1="0" x2="800" y2="600"/><line x1="880" y1="0" x2="880" y2="600"/>
    <line x1="960" y1="0" x2="960" y2="600"/><line x1="1040" y1="0" x2="1040" y2="600"/>
    <line x1="1120" y1="0" x2="1120" y2="600"/><line x1="1200" y1="0" x2="1200" y2="600"/>
    <line x1="1280" y1="0" x2="1280" y2="600"/><line x1="1360" y1="0" x2="1360" y2="600"/>
    <line x1="1440" y1="0" x2="1440" y2="600"/><line x1="1520" y1="0" x2="1520" y2="600"/>
    <line x1="1600" y1="0" x2="1600" y2="600"/><line x1="1680" y1="0" x2="1680" y2="600"/>
    <line x1="1760" y1="0" x2="1760" y2="600"/><line x1="1840" y1="0" x2="1840" y2="600"/>
    <line x1="1920" y1="0" x2="1920" y2="600"/>
    <line x1="0" y1="0" x2="1920" y2="0"/><line x1="0" y1="80" x2="1920" y2="80"/>
    <line x1="0" y1="160" x2="1920" y2="160"/><line x1="0" y1="240" x2="1920" y2="240"/>
    <line x1="0" y1="320" x2="1920" y2="320"/><line x1="0" y1="400" x2="1920" y2="400"/>
    <line x1="0" y1="480" x2="1920" y2="480"/><line x1="0" y1="560" x2="1920" y2="560"/>
  </g>
  <!-- Highlight cells -->
  <rect x="240" y="160" width="80" height="80" fill="white" fill-opacity="0.06" rx="4"/>
  <rect x="480" y="320" width="80" height="80" fill="white" fill-opacity="0.04" rx="4"/>
  <rect x="800" y="80" width="80" height="80" fill="white" fill-opacity="0.05" rx="4"/>
  <rect x="1120" y="240" width="80" height="80" fill="white" fill-opacity="0.06" rx="4"/>
  <rect x="1360" y="400" width="80" height="80" fill="white" fill-opacity="0.04" rx="4"/>
  <rect x="1600" y="160" width="80" height="80" fill="white" fill-opacity="0.05" rx="4"/>
  <rect x="640" y="400" width="80" height="80" fill="white" fill-opacity="0.05" rx="4"/>
  <rect x="960" y="320" width="80" height="80" fill="white" fill-opacity="0.04" rx="4"/>
  <!-- Dots at intersections -->
  <circle cx="320" cy="240" r="4" fill="white" fill-opacity="0.15"/>
  <circle cx="560" cy="400" r="4" fill="white" fill-opacity="0.12"/>
  <circle cx="880" cy="160" r="4" fill="white" fill-opacity="0.15"/>
  <circle cx="1200" cy="320" r="4" fill="white" fill-opacity="0.12"/>
  <circle cx="1440" cy="480" r="4" fill="white" fill-opacity="0.15"/>
  <circle cx="1680" cy="240" r="4" fill="white" fill-opacity="0.12"/>
